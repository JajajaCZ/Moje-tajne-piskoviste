content:
  - name: clanky
    label: Články
    type: collection
    path: clanky
    format: json
    fields:
      - name: title
        label: Nadpis
        type: string

      - name: date
        label: Datum
        type: date

      - name: tags
        label: Tagy1
        type: select
        options:
          multiple: true
          values:
            - Novinka
            - Projekt
            - Linux
            - Ostatní

      - name: desc
        label: Krátký popis
        type: text

      - name: url
        label: URL
        type: string