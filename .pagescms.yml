- name: clanky
    label: Články
    type: collection
    path: clanky/ # Složka, kterou jsme si domluvili
    format: json # Tvůj hackerský přístup se soubory .json
    exclude: ["index.html"] # Ignoruj pomocné soubory
    fields:
      - name: title
        label: Nadpis
        type: string
      - name: date
        label: Datum
        type: date
      - name: tag
        label: Tag
        type: select
        options:
          - Novinka
          - Projekt
          - Linux
          - Ostatní
      - name: desc
        label: Krátký popis
        type: text
      - name: url
        label: URL článku (např. /clanky/moje-novinka)
        type: string