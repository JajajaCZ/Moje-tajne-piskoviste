---
layout: default
---

<article class="post-content-wrapper">
  <header class="post-content-header">
    <h1 class="post-content-title">{{ page.title }}</h1>
    
    <div class="post-content-meta">
      <span class="post-content-datum">📅 {{ page.date | date: "%d. %m. %Y" }}</span>
      {% if page.collection %}
        <span class="post-content-typ">
          {% if page.collection == "projekty" %}🛠️ Projekt{% else %}📝 Článek{% endif %}
        </span>
      {% endif %}
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
