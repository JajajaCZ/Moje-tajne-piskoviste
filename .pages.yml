content:
  - name: clanky
    label: Články
    type: collection
    path: clanky
    format: markdown
    filename: "{{number padding=5}}-{{slug title}}"
    fields:
      - name: title
        label: Nadpis
        type: string

      - name: date
        label: Datum
        type: date

      - name: releaseDate
        label: Datum a čas vydání
        type: string
        placeholder: "2026-05-03 15:30"
        help: "Formát: RRRR-MM-DD HH:MM"

      - name: tags
        label: Tagy
        type: select
        options:
          multiple: true
          values:
            - Novinka
            - Projekt
            - Linux
            - Ostatní

      - name: desc
        label: Krátký popis
        type: text

      - name: body
        label: Obsah článku
        type: rich-text
        options:
          image: true
          heading: true
          bold: true
          italic: true
          bulletList: true
          orderedList: true
          link: true
          blockquote: true
          code: true
          simple: false

      - name: url
        label: URL
        type: string
