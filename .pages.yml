content:
  - name: clanky
    label: Články
    type: collection
    path: clanky
    format: markdown
    filename: "{{number padding=5}}-{{title}}"

    media:
      input: img
      output: /img
      rename: safe
      categories: [image]

    fields:
      - name: title
        label: Nadpis
        type: string

      - name: date
        label: Datum
        type: date

      - name: releaseDate
        label: Datum vydání
        type: date

      - name: releaseTime
        label: Čas vydání
        type: string
        default: 15:30

      - name: tags
        label: Tagy
        type: select
        options:
          multiple: true
          values:
            - Novinka
            - Projekt
            - Linux
            - Ostatní

      - name: desc
        label: Krátký popis
        type: text

      - name: body
        label: Obsah článku
        type: rich-text
        options:
          image: true
          heading: true
          bold: true
          italic: true
          bulletList: true
          orderedList: true
          link: true
          blockquote: true
          code: true
          media: true

      - name: url
        label: URL
        type: string
        default: https://jajajacz.github.io/Moje-tajne-piskoviste/