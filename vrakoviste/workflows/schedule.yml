name: "Nerozbitná automatika (15:30, 17:00, 20:00)"
on:
  schedule:
    # 30 13,14 = spustí se v 13:30 i 14:30 UTC (u nás vždy pokryje 15:30)
    - cron: '30 13,14 * * *'
    # 0 15,16  = spustí se v 15:00 i 16:00 UTC (u nás vždy pokryje 17:00)
    - cron: '0 15,16 * * *'
    # 0 18,19  = spustí se v 18:00 i 19:00 UTC (u nás vždy pokryje 20:00)
    - cron: '0 18,19 * * *'
  workflow_dispatch: # Tlačítko "Run workflow" pro ruční spuštění kdykoliv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages rebuild
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/pages/builds